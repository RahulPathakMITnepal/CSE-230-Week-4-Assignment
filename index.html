<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider Library</title>
  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="page">
    <h1>Image Slider</h1>
    <p class="subtitle">A simple slider built with vanilla JavaScript</p>

    <!-- The slider container. The script builds the arrows and dots for us. -->
    <div class="slider" id="mySlider">
      <div class="slider-track">
        <div class="slide"><img src="./image1.jpg" alt="Chad"></div>
        <div class="slide"><img src="./image2.jpg" alt="Chad"></div>
        <div class="slide"><img src="./image3.jpg" alt="Chad"></div>
        <div class="slide"><img src="./image4.jpg" alt="Chad"></div>
        <div class="slide"><img src="./image5.jpg" alt="Chad"></div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
